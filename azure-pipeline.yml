trigger: none

pool:
  vmImage: ubuntu-latest

variables:
- group: vg-foundry

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- task: AzurePowerShell@5
  displayName: 'Automated Code Reviewer'
  inputs:
    azureSubscription: sc-devops-code-reviewer
    ScriptType: 'InlineScript'
    azurePowerShellVersion: LatestVersion
    pwsh: true
    Inline: |
      . ./Get-CodeChanges.ps1
      . ./Invoke-LLMCodeReview.ps1
      . ./Set-PullRequestComments.ps1

      [string]$changes = Invoke-LLMCodeReview `
        -SourceBranch $(System.PullRequest.SourceBranch) `
        -TargetBranch $(System.PullRequest.TargetBranch) `
        -PathToReviewFile './Generic.codereviewprompt.md' `
        -ModelName 'gpt-5.1-chat' `
        -ModelDeploymentUrl 'https://aif-careprotech.services.ai.azure.com/api/projects/proj-careprotech/openai/v1/responses' `
        -MaxChangesLength 30000 `
        -RequestTimeoutSeconds 600 `
        -MaxOutputTokens 12000 `
        -Key $(foundry-key)

      Set-PullRequestComments `
        -Organization ("$(System.CollectionUri)" -split "/" | Select-Object -index 3) `
        -PullRequestId $(System.PullRequest.PullRequestId) `
        -Project $(System.TeamProject) `
        -RepositoryName $(Build.Repository.Name) `
        -Reviews $changes
